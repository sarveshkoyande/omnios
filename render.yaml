# Storage model: SQLite files + blob store on the persistent disk below (durable across
# deploys). This is the app's native, zero-cost data layer. The Postgres path
# (strategy/db.py + POSTGRES_MIGRATION.md) still exists and activates if DATABASE_URL is set,
# but it is intentionally NOT set here yet: a trial on Prisma Postgres hit the free-tier plan
# limit (the ~170MB knowledge base + 540K-row load exceeded it, locking the database). The
# knowledge base (and HCP 360) are now pinned to local SQLite regardless of DATABASE_URL
# (strategy/db.py's LOCAL_ONLY_STORES) -- they're large, committed-seed reference data
# rebuilt on every boot, not per-run output, so they should never be the thing that fills up
# a managed Postgres. It is now SAFE to set DATABASE_URL (e.g. to a Neon connection string)
# to move just the genuine per-run output (projects/campaigns/brand_memory/orchestration/
# tab_chat) to a managed Postgres -- that data stays small regardless of how large the KB or
# HCP 360 seed grows. The knowledge base ships as a ~90MB dependency-slim seed committed in
# git (assets/seed/omni_kb.db), seeded to the disk by bootstrap.py on first boot either way.

services:
  - type: web
    name: omni-data-hub
    runtime: python
    # A persistent disk (below) requires a paid instance -- disks are not offered on the
    # free plan, and a web service's own filesystem is ephemeral (wiped on every deploy and
    # restart). Without this, all SQLite data + blobs under DATA_DIR are lost each deploy.
    plan: starter
    # `playwright install --with-deps chromium` downloads a real Chromium (~150MB) plus its
    # system libraries (via apt) -- needed so "Download PDF" renders the plan with the app's
    # actual CSS instead of a plain reportlab approximation. Adds real build time and image
    # size; if this ever becomes a problem, export.pdf falls back automatically to the
    # markdown-based renderer when Chromium isn't available, so removing this line degrades
    # PDF fidelity rather than breaking the export.
    buildCommand: pip install -r requirements.txt && python -m playwright install --with-deps chromium
    startCommand: uvicorn app.server:app --host 0.0.0.0 --port $PORT
    # Durable storage for every SQLite DB (projects/campaigns/brand memory) and the blob
    # store. paths.py routes all data access under OMNI_DATA_DIR; bootstrap.py seeds this
    # disk once on first boot (KB snapshot + content library) and it persists thereafter.
    disk:
      name: omni-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      # Pin the build's Python version. Render's platform default drifted to 3.14.x, but
      # litellm==1.91.3 (below, part of the cognee memory layer) requires Python <3.14 --
      # without this pin the build fails with "No matching distribution found for
      # litellm==1.91.3". 3.12 matches the version this whole dependency stack (cognee +
      # litellm + fastembed) was developed and verified against locally.
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: OMNI_DATA_DIR
        value: /var/data
      # Use the Foundry RESOURCE name (not a full endpoint). The AnthropicFoundry SDK
      # derives the correct Anthropic passthrough URL from it:
      # https://<resource>.services.ai.azure.com/anthropic/ . Do NOT set
      # AZURE_AI_FOUNDRY_ENDPOINT to a project endpoint (.../api/projects/<name>) -- that
      # URL shape is the Agents/Projects API and 400s with "Missing required query
      # parameter: api-version" on the messages call.
      - key: AZURE_AI_FOUNDRY_RESOURCE
        value: genai-demos-resource
      - key: AZURE_AI_FOUNDRY_DEPLOYMENT
        value: claude-sonnet-5
      # Secret -- set the actual key in the Render dashboard (Environment tab); sync:false
      # keeps it out of the repo. Without it the LLM path is disabled (rules engine only).
      - key: AZURE_AI_FOUNDRY_API_KEY
        sync: false
